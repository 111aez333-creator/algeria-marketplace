<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>سوق الجزائر</title>
<style>body{font-family:system-ui,sans-serif;text-align:center;padding:60px 16px;color:#0f172a}a{color:#0b7a75;font-weight:700}</style></head>
<body><h1>جاري التحويل…</h1><p><a id="home" href="./">العودة لسوق الجزائر</a></p>
<script>
// إعلان جديد ما تولّدتش صفحتو الثابتة بعد (l/<id>.html): نوجّهو للتطبيق مباشرة.
(function () {
  var m = location.pathname.match(/\/l\/([A-Za-z0-9_-]{1,128})\.html$/);
  var base = location.pathname.replace(/\/l\/[^/]*$/, '/');
  if (!m) { base = location.pathname.split('/').slice(0, 2).join('/') + '/'; }
  var target = m ? base + '?view=listing&id=' + encodeURIComponent(m[1]) : base;
  var a = document.getElementById('home'); if (a) a.href = target;
  location.replace(target);
})();
</script></body></html>
